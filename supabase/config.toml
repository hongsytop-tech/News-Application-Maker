# Supabase local/project configuration.
project_id = "news-application-maker"

[functions.crawl-proxy]
# Called while browsing signed-out, and the new publishable key is NOT a JWT,
# so JWT verification must be off for the feed to load without a login.
verify_jwt = false

[functions.ai-summarize]
# Also called signed-out (on-demand summaries).
verify_jwt = false

[functions.ai-classify]
# Batch article sub-category classification; called from the feed (signed-out ok).
verify_jwt = false

[functions.ai-taste]
# Taste profiling requires a signed-in user (identified from the JWT).
verify_jwt = true
