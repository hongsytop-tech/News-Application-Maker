<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#1565C0">
  <meta name="description" content="News feed & bookmark app.">

  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="News">

  <title>News</title>
  <!-- ?v bump busts the browser's sticky favicon cache when the icon changes. -->
  <link rel="icon" type="image/png" href="favicon.png?v=2"/>
  <link rel="apple-touch-icon" href="icons/Icon-192.png?v=2"/>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <style>
    #boot {
      position: fixed; inset: 0; display: flex; align-items: center;
      justify-content: center; flex-direction: column; gap: 16px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: #1565C0;
    }
    #boot .spin {
      width: 36px; height: 36px; border: 4px solid #d6e4f5;
      border-top-color: #1565C0; border-radius: 50%;
      animation: spin 0.9s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
  <div id="boot"><div class="spin"></div><div>News 로딩 중…</div></div>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
