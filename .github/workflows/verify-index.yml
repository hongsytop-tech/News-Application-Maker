name: verify-index
on:
  push:
    branches: [claude/intelligent-babbage-eah84q]
    paths: ['.github/workflows/verify-index.yml']

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Probe Naver index endpoints
        run: |
          UA='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124 Safari/537.36'
          for CODE in KOSPI KOSDAQ; do
            echo "===== realtime/domestic/index/$CODE ====="
            curl -s -H "User-Agent: $UA" -H "Referer: https://m.stock.naver.com/" \
              "https://polling.finance.naver.com/api/realtime/domestic/index/$CODE" | head -c 2000
            echo ""
            echo "===== api/index/$CODE/basic ====="
            curl -s -H "User-Agent: $UA" -H "Referer: https://m.stock.naver.com/" \
              "https://m.stock.naver.com/api/index/$CODE/basic" | head -c 2000
            echo ""
          done
