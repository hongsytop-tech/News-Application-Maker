name: verify-index
on:
  push:
    branches: [claude/intelligent-babbage-eah84q]
    paths: ['.github/workflows/verify-index.yml']

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Probe Naver world index (S&P500 / NASDAQ) endpoints
        run: |
          UA='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124 Safari/537.36'
          H=(-A "$UA" -H 'Referer: https://m.stock.naver.com/' --max-time 25)
          echo "===== AC search: S&P 500 / 나스닥 (target=index) ====="
          curl -s "${H[@]}" "https://ac.stock.naver.com/ac?q=$(python3 -c 'import urllib.parse;print(urllib.parse.quote("S&P 500"))')&target=index,marketindexworld&st=111" | head -c 1200; echo
          curl -s "${H[@]}" "https://ac.stock.naver.com/ac?q=$(python3 -c 'import urllib.parse;print(urllib.parse.quote("나스닥"))')&target=index,marketindexworld&st=111" | head -c 1200; echo
          echo ""
          echo "===== basic endpoint candidates ====="
          for code in ".INX" ".IXIC" ".DJI" "SPI@SPX" "NAS@IXIC"; do
            enc=$(python3 -c "import urllib.parse,sys;print(urllib.parse.quote(sys.argv[1]))" "$code")
            for base in \
              "https://api.stock.naver.com/index/$enc/basic" \
              "https://m.stock.naver.com/api/index/$enc/basic" \
              "https://api.stock.naver.com/marketindex/$enc/basic" ; do
              out=$(curl -s "${H[@]}" "$base")
              cp=$(echo "$out" | grep -oE '"closePrice" *: *"[^"]*"' | head -1)
              chg=$(echo "$out" | grep -oE '"compareToPreviousClosePrice" *: *"[^"]*"' | head -1)
              ic=$(echo "$out" | grep -oE '"imageCharts"' | head -1)
              ok=$(echo "$out" | head -c 40 | tr -d '\n')
              echo "[$code] $base => close=$cp chg=$chg ic=$ic  first40=$ok"
            done
          done
