name: verify-chart
on:
  push:
    branches: [claude/intelligent-babbage-eah84q]
    paths: ['.github/workflows/verify-chart.yml']

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Probe chart image hosts (referer sensitivity, periods, world)
        run: |
          UA='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124 Safari/537.36'
          REF='https://m.stock.naver.com/'
          FAKEREF='https://hongsytop-tech.github.io/'
          t() {
            url="$1"
            n=$(curl -s -o /dev/null -w '%{http_code}:%{content_type}' -A "$UA" --max-time 20 "$url")
            r=$(curl -s -o /dev/null -w '%{http_code}:%{content_type}' -A "$UA" -e "$REF" --max-time 20 "$url")
            g=$(curl -s -o /dev/null -w '%{http_code}:%{content_type}' -A "$UA" -e "$FAKEREF" --max-time 20 "$url")
            echo "noref=$n naverref=$r githubref=$g  $url"
          }
          echo "===== ssl.pstatic.net domestic 445680 ====="
          t "https://ssl.pstatic.net/imgfinance/chart/item/candle/day/445680.png"
          t "https://ssl.pstatic.net/imgfinance/chart/item/area/year/445680.png"
          t "https://ssl.pstatic.net/imgfinance/chart/mobile/candle/day/445680_end.png"
          t "https://ssl.pstatic.net/imgfinance/chart/mobile/candle/week/445680_end.png"
          t "https://ssl.pstatic.net/imgfinance/chart/mobile/candle/month/445680_end.png"
          t "https://ssl.pstatic.net/imgfinance/chart/mobile/area/year/445680_end.png"
          echo "===== financial-vn domestic (from imageCharts) 445680 ====="
          t "https://financial-vn.pstatic.net/chart/mobile/candle/day/445680_end.png"
          echo "===== world TSLA.O ====="
          t "https://ssl.pstatic.net/imgfinance/chart/mobile/world/item/candle/day/TSLA.O_end.png"
          t "https://financial-vn.pstatic.net/chart/mobile/world/item/candle/day/TSLA.O_end.png"
          t "https://ssl.pstatic.net/imgfinance/chart/mobile/world/item/day/TSLA.O_end.png"
