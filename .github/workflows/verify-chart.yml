name: verify-chart
on:
  push:
    branches: [claude/intelligent-babbage-eah84q]
    paths: ['.github/workflows/verify-chart.yml']

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Probe Naver stock chart image URLs
        run: |
          UA='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124 Safari/537.36'
          echo "===== domestic basic (005930 삼성전자) imageCharts ====="
          curl -s -A "$UA" -H 'Referer: https://m.stock.naver.com/' --max-time 25 \
            "https://m.stock.naver.com/api/stock/005930/basic" \
            | grep -oE '"(imageCharts|day|candleDay|candleWeek|candleMonth|areaMonthThree|areaYear)"[^,}]{0,120}' | head -30
          echo ""
          echo "===== world basic (AAPL.O) imageCharts ====="
          curl -s -A "$UA" -H 'Referer: https://m.stock.naver.com/' --max-time 25 \
            "https://api.stock.naver.com/stock/AAPL.O/basic" \
            | grep -oE '"(imageCharts|day|candleDay|areaYear)"[^,}]{0,120}' | head -20
          echo ""
          echo "===== static chart image URL patterns (domestic 005930) ====="
          for path in \
            "item/area/day/005930.png" \
            "item/candle/day/005930.png" \
            "item/area/month/005930.png" \
            "item/area/year/005930.png" \
            "mobile/candle/day/005930_end.png" \
            "mobile/day/005930_end.png" ; do
            u="https://ssl.pstatic.net/imgfinance/chart/$path"
            code=$(curl -s -o /tmp/c.png -w '%{http_code} %{content_type}' -A "$UA" --max-time 20 "$u")
            echo "[$code] size=$(wc -c < /tmp/c.png)  $u"
          done
