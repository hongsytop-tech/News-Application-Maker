name: verify-otc
on:
  push:
    branches: [claude/intelligent-babbage-eah84q]
    paths: ['.github/workflows/verify-otc.yml']

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Probe front-api autoComplete + JS bundle scrape (round 4)
        run: |
          UA='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124 Safari/537.36'
          ac() {
            echo "----- autoComplete q=$1 target=$2"
            curl -s -G "https://m.stock.naver.com/front-api/search/autoComplete" \
              -H "User-Agent: $UA" -H "Referer: https://m.stock.naver.com/" \
              --data-urlencode "query=$1" --data-urlencode "target=$2" | head -c 900
            echo ""
          }

          echo "##### baseline listed schema #####"
          ac "삼성전자" "stock,index,ipo,unlisted"
          echo "##### unlisted candidates, various targets #####"
          for N in 비바리퍼블리카 무신사 당근마켓 야놀자 오아시스 두나무 빗썸코리아 케이뱅크; do
            ac "$N" "stock,index,ipo,unlisted,otc,nonlisted"
          done

          echo "##### JS bundle discovery #####"
          PAGE=$(curl -s -H "User-Agent: $UA" "https://m.stock.naver.com/")
          echo "$PAGE" | grep -oE 'src="[^"]+\.js[^"]*"' | sed 's/src="//;s/"$//' | sort -u > /tmp/srcs.txt
          echo "script srcs found:"; cat /tmp/srcs.txt
          while read -r S; do
            [ -z "$S" ] && continue
            case "$S" in
              http*) U="$S" ;;
              /*) U="https://m.stock.naver.com$S" ;;
              *) U="https://m.stock.naver.com/$S" ;;
            esac
            BODY=$(curl -s -H "User-Agent: $UA" "$U")
            echo "===== $U matches:"
            echo "$BODY" | grep -oE '(front-api|/api)/[A-Za-z0-9{}/_.:-]*(unlisted|otc|nonlisted|stockInfo|autoComplete)[A-Za-z0-9{}/_.:-]*' | sort -u | head -30
            echo "$BODY" | grep -oiE '[A-Za-z0-9_]*unlisted[A-Za-z0-9_]*' | sort -u | head -20
          done < /tmp/srcs.txt
