name: verify-otc
on:
  push:
    branches: [claude/intelligent-babbage-eah84q]
    paths: ['.github/workflows/verify-otc.yml']

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Probe Npay 증권 front-api (비상장) round 3
        run: |
          UA='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124 Safari/537.36'
          enc() { python3 -c "import urllib.parse,sys;print(urllib.parse.quote(sys.argv[1]))" "$1"; }
          get() { echo "----- $1"; curl -s -H "User-Agent: $UA" -H "Referer: https://m.stock.naver.com/" "$1" | head -c 900; echo ""; }
          Q=$(enc 비바리퍼블리카)

          echo "##### front-api search #####"
          get "https://m.stock.naver.com/front-api/search/autoComplete?query=$Q&target=stock,index,ipo,unlisted"
          get "https://m.stock.naver.com/front-api/v1/search/autoComplete?query=$Q&target=stock,unlisted"
          get "https://m.stock.naver.com/front-api/search/integrate?query=$Q"
          get "https://m.stock.naver.com/front-api/v1/search/integrate?query=$Q"

          echo "##### front-api unlisted ranking/list #####"
          get "https://m.stock.naver.com/front-api/v1/unlisted/ranking?category=POPULAR&page=1&pageSize=5"
          get "https://m.stock.naver.com/front-api/unlisted/ranking?page=1&pageSize=5"
          get "https://m.stock.naver.com/front-api/v1/unlisted/popular"

          echo "##### scrape unlisted page HTML for api hints #####"
          for U in \
            "https://m.stock.naver.com/investment/unlisted" \
            "https://m.stock.naver.com/unlisted" ; do
            echo "----- PAGE $U"
            curl -s -H "User-Agent: $UA" "$U" \
              | grep -oE '(front-api|/api/)[A-Za-z0-9/_?=&.-]+' | sort -u | head -40
          done
