name: verify-otc
on:
  push:
    branches: [claude/intelligent-babbage-eah84q]
    paths: ['.github/workflows/verify-otc.yml']

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Probe Naver unlisted (비상장) endpoints round 2
        run: |
          UA='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124 Safari/537.36'
          enc() { python3 -c "import urllib.parse,sys;print(urllib.parse.quote(sys.argv[1]))" "$1"; }
          get() { echo "----- $1"; curl -s -H "User-Agent: $UA" -H "Referer: https://m.stock.naver.com/" "$1" | head -c 1200; echo ""; }

          Q=$(enc 비바리퍼블리카)
          echo "##### integrated/full search candidates #####"
          get "https://m.stock.naver.com/api/search/integration?query=$Q"
          get "https://api.stock.naver.com/search/integration?query=$Q"
          get "https://api.stock.naver.com/search/all?query=$Q"
          get "https://m.stock.naver.com/api/search/all?query=$Q"

          echo "##### unlisted-targeted autocomplete #####"
          get "https://ac.stock.naver.com/ac?q=$Q&target=unlisted&st=111"
          get "https://ac.stock.naver.com/ac?q=$Q&target=stock,unlisted,ipo,index&st=111&frm=stock"

          echo "##### unlisted list / home #####"
          get "https://api.stock.naver.com/unlisted/list?page=1&pageSize=5"
          get "https://api.stock.naver.com/unlisted?page=1&pageSize=5"
          get "https://m.stock.naver.com/api/unlisted/ranking?category=POPULAR&page=1&pageSize=5"
          get "https://api.stock.naver.com/stock/unlisted/ranking?page=1&pageSize=5"
