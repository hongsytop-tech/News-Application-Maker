name: Deploy Web (GitHub Pages)

on:
  push:
    branches:
      - main
      - "claude/**"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Create .env from secrets
        run: |
          cat > .env <<EOF
          SUPABASE_URL=${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}
          CRAWL_PROXY_URL=${{ secrets.CRAWL_PROXY_URL }}
          EOF

      - run: flutter pub get

      - name: Build web
        # base-href must match the Pages sub-path (the repo name).
        # pwa-strategy=none disables the service worker so redeploys never
        # serve a stale main.dart.js. BUILD_ID is compiled in so the running
        # app can compare itself against the deployed version-info.json.
        run: |
          flutter build web --release --source-maps --pwa-strategy none \
            --base-href "/${{ github.event.repository.name }}/" \
            --dart-define=BUILD_ID=${{ github.sha }}
          printf '{"build":"%s","time":"%s"}\n' \
            "${{ github.sha }}" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            > build/web/version-info.json

      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
