name: verify-crawl
on:
  push:
    branches: [claude/intelligent-babbage-eah84q]
    paths: ['.github/workflows/verify-crawl.yml']

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Probe Google News link resolution + jina
        run: |
          UA='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124 Safari/537.36'
          FEED='https://news.google.com/rss/headlines/section/topic/BUSINESS?hl=ko&gl=KR&ceid=KR:ko'
          echo "===== 1) fetch Google News BUSINESS RSS, first item link ====="
          curl -s -A "$UA" --max-time 25 "$FEED" > /tmp/feed.xml
          echo "feed size=$(wc -c < /tmp/feed.xml)"
          LINK=$(grep -oE 'https://news.google.com/rss/articles/[^<]+' /tmp/feed.xml | head -1)
          echo "first item link: $LINK"

          echo "===== 2) fetch that link with -L (follow redirects) ====="
          eff=$(curl -s -L -A "$UA" -o /tmp/a.html -w '%{url_effective}' --max-time 30 "$LINK" || echo ERR)
          echo "effective_url=$eff"
          echo "size=$(wc -c < /tmp/a.html) articleBody=$(grep -o 'articleBody' /tmp/a.html | wc -l) p=$(grep -o '<p[ >]' /tmp/a.html | wc -l)"
          echo "--- head 300 ---"; head -c 300 /tmp/a.html; echo ""

          echo "===== 3) jina on the google link ====="
          jc=$(curl -s -o /tmp/j1.txt -w '%{http_code}' -A "$UA" --max-time 45 "https://r.jina.ai/$LINK" || echo ERR)
          echo "jina(google) code=$jc size=$(wc -c < /tmp/j1.txt)"
          head -c 500 /tmp/j1.txt; echo ""

          echo "===== 4) jina on the direct CNBC url ====="
          CNBC='https://www.cnbc.com/2026/07/20/tsmc-arizona-fab-capacity-ai-chip-demand.html'
          jc2=$(curl -s -o /tmp/j2.txt -w '%{http_code}' -A "$UA" --max-time 45 "https://r.jina.ai/$CNBC" || echo ERR)
          echo "jina(cnbc) code=$jc2 size=$(wc -c < /tmp/j2.txt)"
          head -c 500 /tmp/j2.txt; echo ""
