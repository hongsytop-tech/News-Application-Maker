name: verify-crawl
on:
  push:
    branches: [claude/intelligent-babbage-eah84q]
    paths: ['.github/workflows/verify-crawl.yml']

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Probe paywalled Barron's article
        run: |
          UA='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124 Safari/537.36'
          URL='https://www.barrons.com/articles/spacex-stock-price-defense-depratmenmt-deal-4dd10e5b'
          echo "===== direct fetch ====="
          code=$(curl -s -o /tmp/b.html -w '%{http_code}' -A "$UA" -H 'Accept: text/html' --max-time 30 "$URL" || echo ERR)
          echo "code=$code size=$(wc -c < /tmp/b.html) ldjson=$(grep -o 'application/ld+json' /tmp/b.html | wc -l) articleBody=$(grep -o 'articleBody' /tmp/b.html | wc -l) p=$(grep -o '<p[ >]' /tmp/b.html | wc -l)"
          echo "--- articleBody snippet ---"
          grep -oE '"articleBody" *: *"[^"]{0,400}' /tmp/b.html | head -c 500
          echo ""
          echo "--- og:description ---"
          grep -oE 'og:description[^>]*content="[^"]{0,300}' /tmp/b.html | head -c 400
          echo ""
          echo "--- paywall markers ---"
          echo "isAccessibleForFree=$(grep -o 'isAccessibleForFree' /tmp/b.html | wc -l) subscribe=$(grep -oi 'subscribe' /tmp/b.html | wc -l)"
          echo "===== jina reader ====="
          jc=$(curl -s -o /tmp/j.txt -w '%{http_code}' -A "$UA" --max-time 45 "https://r.jina.ai/$URL" || echo ERR)
          echo "jina code=$jc size=$(wc -c < /tmp/j.txt)"
          head -c 1200 /tmp/j.txt
          echo ""
