name: verify-crawl
on:
  push:
    branches: [claude/intelligent-babbage-eah84q]
    paths: ['.github/workflows/verify-crawl.yml']

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Probe JSON-LD articleBody + jina reader
        run: |
          UA='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124 Safari/537.36'
          for url in \
            "https://techcrunch.com/2026/07/19/can-an-apple-lawsuit-derail-openais-hardware-plans/" \
            "https://www.foxbusiness.com/retail/dollar-tree-shutter-75-stores-while-growing-overall-footprint" ; do
            echo "##### $url"
            curl -s -A "$UA" --max-time 25 "$url" > /tmp/b.html
            echo "ldjson_blocks=$(grep -o 'application/ld+json' /tmp/b.html | wc -l) articleBody_hits=$(grep -o 'articleBody' /tmp/b.html | wc -l)"
            echo "--- articleBody snippet ---"
            grep -oE '"articleBody" *: *"[^"]{0,300}' /tmp/b.html | head -c 400
            echo ""
            echo "--- og:description ---"
            grep -oE '<meta[^>]+og:description[^>]*>' /tmp/b.html | head -c 400
            echo ""
            echo "--- jina reader r.jina.ai ---"
            jcode=$(curl -s -o /tmp/j.txt -w '%{http_code}' -A "$UA" --max-time 40 "https://r.jina.ai/$url" || echo ERR)
            echo "jina code=$jcode size=$(wc -c < /tmp/j.txt)"
            head -c 700 /tmp/j.txt
            echo ""
            echo "==================================="
          done
